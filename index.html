<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracy Tran · Resume</title>
    <meta
      name="description"
      content="Resume of Tracy Tran, a computer science student and full-stack developer in Fullerton, California."
    />
    <meta name="theme-color" content="#2a2724" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a fallback
         font until they arrive (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,650;8..60,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,650;8..60,700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- The welcome title is in the HTML so it paints before the JavaScript
         runs; React replaces it with the same screen plus the petals. -->
    <div id="root">
      <div class="desk">
        <div class="welcome" role="status">
          <div class="welcome-copy">
            <p class="welcome-title">WELCOME TO MY<br />INTERACTIVE RESUME</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
